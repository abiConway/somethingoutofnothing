<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Two columns: text on the left, photos start at the middle of the page */
    .wrap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 2rem; align-items: start; }
    .blurb { grid-column: 1; grid-row: 1; margin: 0; overflow-wrap: anywhere; }
    .blurb p { margin: 0 0 1.5rem; }
    .media { grid-column: 2; grid-row: 1; display: grid; grid-template-columns: repeat(3, 1fr);
             gap: 2rem 1rem; justify-items: center; align-content: start; }
    .media .ph { position: relative; width: 100%; aspect-ratio: 1; }
    .media .ph.video { width: 90%; aspect-ratio: 16 / 9; }
    .media .ph.pdf { aspect-ratio: 8.5 / 11; }

    .ph.zoom { cursor: zoom-in; transition: scale .15s ease; }
    .ph.zoom:hover { scale: 1.05; }
    button.ph { border: 0; font: inherit; letter-spacing: inherit; cursor: pointer; transition: scale .15s ease; }
    button.ph:hover { scale: 1.05; }
    .ph canvas { width: 100%; height: 100%; display: block; object-fit: cover; object-position: top; }
    .pdf-tag { position: absolute; left: 0; bottom: 0; background: var(--cream); color: #111; padding: .15rem .5rem; font-size: .7rem; }

    /* Lightbox */
    #lightbox { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; padding: 0; border: 0; color: var(--cream); background: rgba(4, 51, 255, .97); }
    #lightbox::backdrop { background: rgba(0, 0, 0, .6); }
    .lb { height: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .5rem; padding: 1rem; }
    #lbStage { display: flex; align-items: center; justify-content: center; min-width: 0; }
    #lbStage img, #lbStage video { max-width: 100%; max-height: 82vh; object-fit: contain; }
    .lb button { font: inherit; letter-spacing: inherit; color: var(--cream); background: none; border: 0; cursor: pointer; padding: .75rem; font-size: 1.4rem; }
    .lb button:hover { color: var(--chartreuse); }
    #lbStage iframe { width: min(60rem, 100%); height: 82vh; border: 0; background: #fff; }
    #lbDownload { position: absolute; top: 1rem; left: 1.25rem; display: none; font-size: .85rem; }
    #lbClose { position: absolute; top: .5rem; right: .75rem; font-size: .85rem; }
    #lbCount { position: absolute; bottom: .75rem; left: 0; right: 0; text-align: center; }

    /* Phones: text on top, photos underneath in 2 columns */
    @media (max-width: 700px) {
      .wrap { grid-template-columns: 1fr; }
      .blurb, .media { grid-column: 1; grid-row: auto; }
      .media { grid-template-columns: repeat(2, 1fr); margin-top: 1.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <a class="site-title" href="index.html">Welcome to the Rodeo</a>
    <div class="dropdown" id="menu">
      <button class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">Menu ▾</button>
      <ul class="dropdown-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="mailto:xaviervandemarkconway@gmail.com">Contact</a></li>
      </ul>
    </div>
  </header>

  <main class="page">
    <div class="wrap">
      <div class="blurb" id="blurb"></div>
      <div class="media" id="media"></div>
    </div>
  </main>

  <footer>
    <a href="https://instagram.com/xaviervandemarkconway">@xaviervandemarkconway</a>
    <a href="tel:+17194249460">(719) 424-9460</a>
    <a href="mailto:xaviervandemarkconway@gmail.com">xaviervandemarkconway@gmail.com</a>
  </footer>

  <dialog id="lightbox">
    <div class="lb">
      <button type="button" id="lbPrev" aria-label="Previous">←</button>
      <div id="lbStage"></div>
      <button type="button" id="lbNext" aria-label="Next">→</button>
      <button type="button" id="lbClose">Close ✕</button>
      <span id="lbCount"></span>
      <a id="lbDownload" download>Download PDF</a>
    </div>
  </dialog>

  <script src="projects.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('p');
    const p = projects[id] || projects[1];
    document.title = p.title;

    // Text: "Project: Title", then the description, then "Goal: ..."
    const blurbEl = document.getElementById('blurb');
    [['Project', p.title], ['Description', p.description], ['Goal', p.goal]].forEach(([label, text]) => {
      if (!text) return;
      const para = document.createElement('p');
      para.textContent = `${text}`;
      blurbEl.append(para);
    });

    const isPdf = m => !!m && /\.pdf$/i.test(m);
    const isVideo = m => /\.(mp4|webm|mov)$/i.test(m);
    const enc = s => { try { return encodeURI(decodeURI(s)); } catch { return s; } }; // handles spaces in filenames
    const items = p.media;                          // photos / videos / PDFs / placeholders
    const gallery = p.media.filter(Boolean);        // what the lightbox flips through (photos, videos, PDFs)

    // ---- Lightbox ----
    const lb = document.getElementById('lightbox'), lbStage = document.getElementById('lbStage');
    let cur = 0;
    function showLb(i) {
      cur = (i + gallery.length) % gallery.length;
      const src = gallery[cur];
      let el;
      if (isPdf(src)) {
        el = Object.assign(document.createElement('iframe'), { src: enc(src) + '#view=FitH', title: `${p.title}, PDF ${cur + 1}` });
      } else if (isVideo(src)) {
        el = Object.assign(document.createElement('video'), { src: enc(src), controls: true, autoplay: true, loop: true, playsInline: true });
      } else {
        el = Object.assign(document.createElement('img'), { src: enc(src), alt: `${p.title}, image ${cur + 1}` });
      }
      lbStage.replaceChildren(el);
      const dl = document.getElementById('lbDownload');
      dl.style.display = isPdf(src) ? 'block' : 'none';
      dl.href = enc(src);
      document.getElementById('lbCount').textContent = `${cur + 1} / ${gallery.length}`;
    }
    function openLb(i) {
      showLb(i);
      const vis = gallery.length > 1 ? 'visible' : 'hidden';
      document.getElementById('lbPrev').style.visibility = vis;
      document.getElementById('lbNext').style.visibility = vis;
      lb.showModal();
    }
    document.getElementById('lbPrev').addEventListener('click', () => showLb(cur - 1));
    document.getElementById('lbNext').addEventListener('click', () => showLb(cur + 1));
    document.getElementById('lbClose').addEventListener('click', () => lb.close());
    lb.addEventListener('click', e => { if (!e.target.closest('img, video, iframe, button, a')) lb.close(); });
    lb.addEventListener('close', () => lbStage.replaceChildren());
    lb.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') showLb(cur + 1);
      if (e.key === 'ArrowLeft') showLb(cur - 1);
    });

    // ---- PDF thumbnails (first page, drawn with PDF.js from cdnjs) ----
    const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    let pdfjsReady;
    function loadPdfJs() {
      pdfjsReady = pdfjsReady || new Promise((resolve, reject) => {
        const sc = document.createElement('script');
        sc.src = PDFJS + 'pdf.min.js';
        sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; resolve(pdfjsLib); };
        sc.onerror = reject;
        document.head.append(sc);
      });
      return pdfjsReady;
    }
    async function pdfThumb(src, box) {
      try {
        const lib = await loadPdfJs();
        const page = await (await lib.getDocument(enc(src)).promise).getPage(1);
        const base = page.getViewport({ scale: 1 });
        const view = page.getViewport({ scale: 400 / base.width });
        const canvas = document.createElement('canvas');
        canvas.width = view.width; canvas.height = view.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport: view }).promise;
        const tag = Object.assign(document.createElement('span'), { className: 'pdf-tag', textContent: 'PDF' });
        box.textContent = '';
        box.classList.add('has-media');
        box.append(canvas, tag);
      } catch (err) {
        console.warn('PDF preview failed for:', enc(src), err); // box keeps its text label
      }
    }

    // ---- Photo / video / PDF tiles ----
    items.forEach((src, i) => {
      const pdf = isPdf(src);
      const box = document.createElement(pdf ? 'button' : 'div');
      box.className = 'ph';
      if (pdf) {
        const label = decodeURIComponent(src.split('/').pop().replace(/\.pdf$/i, ''));
        box.type = 'button';
        box.classList.add('pdf');
        box.textContent = 'PDF: ' + label;
        box.setAttribute('aria-label', 'Open PDF: ' + label);
        box.addEventListener('click', () => openLb(gallery.indexOf(src)));
        pdfThumb(src, box);
      } else if (src) {
        box.classList.add('has-media', 'zoom');
        box.tabIndex = 0;
        box.setAttribute('role', 'button');
        box.setAttribute('aria-label', 'View larger');
        const idx = gallery.indexOf(src);
        box.addEventListener('click', () => openLb(idx));
        box.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(idx); } });
        if (isVideo(src)) {
          box.classList.add('video');
          box.append(Object.assign(document.createElement('video'), { src: enc(src), autoplay: true, muted: true, loop: true, playsInline: true }));
        } else {
          box.append(Object.assign(document.createElement('img'), { src: enc(src), alt: `${p.title}, image ${i + 1}` }));
        }
      } else {
        box.textContent = 'Photo';
      }
      document.getElementById('media').append(box);
    });
  </script>
  <script src="menu.js"></script>
</body>
</html>
