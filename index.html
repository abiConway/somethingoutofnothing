<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xavier VanDemark-Conway</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .stage { flex: 1; position: relative; overflow: hidden; min-height: 30rem; }
    .hero {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(34rem, calc(100% - 2rem)); text-align: center; z-index: 2;
    }
    .hero a { display: block; min-height: 1.6em; }
    .sq {
      --S: clamp(64px, 11vw, 130px);
      position: absolute; left: 0; top: 0; width: var(--S); height: var(--S);
      display: block; transition: scale .15s ease;
    }
    .sq:hover { scale: 1.08; }
  </style>
</head>
<body>
  <header>
    <a class="site-title" href="index.html">Welcome to the Rodeo</a>
    <div class="dropdown" id="menu">
      <button class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">Menu ▾</button>
      <ul class="dropdown-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="mailto:xaviervandemarkconway@gmail.com">Contact</a></li>
      </ul>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="hero" id="hero">
      <a href="about.html" data-type>Name: Xavier VanDemark-Conway</a>
      <a href="about.html" data-type>Location: “Somewhere” in Colorado</a>
      <a href="about.html" data-type>Project: Portfolio</a>
    </div>

    <!-- 7 colored squares, each links to its project page -->
    <a class="sq" href="project.html?p=1" style="background:#940219" aria-label="Project 1"></a>
    <a class="sq" href="project.html?p=2" style="background:#133524" aria-label="Project 2"></a>
    <a class="sq" href="project.html?p=3" style="background:#fff8e6" aria-label="Project 3"></a>
    <a class="sq" href="project.html?p=4" style="background:#472d1c" aria-label="Project 4"></a>
    <a class="sq" href="project.html?p=5" style="background:#d1e232" aria-label="Project 5"></a>
    <a class="sq" href="project.html?p=6" style="background:#808080" aria-label="Project 6"></a>
    <a class="sq" href="project.html?p=7" style="background:#27185d" aria-label="Project 7"></a>
  </main>

  <footer>
    <a href="https://instagram.com/xaviervandemarkconway">@xaviervandemarkconway</a>
    <a href="tel:+17194249460">(719) 424-9460</a>
    <a href="mailto:xaviervandemarkconway@gmail.com">xaviervandemarkconway@gmail.com</a>
  </footer>

  <script>
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---- Typewriter ----
    const lines = [...document.querySelectorAll('[data-type]')];
    const texts = lines.map(l => l.textContent);
    if (!reduce) {
      lines.forEach(l => { l.setAttribute('aria-label', l.textContent); l.textContent = ''; });
      (async () => {
        for (let i = 0; i < lines.length; i++) {
          const node = document.createTextNode('');
          lines[i].append(node);
          for (const ch of texts[i]) { node.textContent += ch; await new Promise(r => setTimeout(r, 60)); }
          await new Promise(r => setTimeout(r, 300));
        }
      })();
    }

    // ---- Squares: random placement + slow drift ----
    const stage = document.getElementById('stage');
    const hero = document.getElementById('hero');
    const sq = [...stage.querySelectorAll('.sq')].map(el => {
      const s = { el, hover: false };
      el.addEventListener('mouseenter', () => s.hover = true);
      el.addEventListener('mouseleave', () => s.hover = false);
      return s;
    });
    let W, H, S, block;
    const hit = (x, y, b) => x < b.r && x + S > b.l && y < b.b && y + S > b.t;

    function layout() {
      W = stage.clientWidth; H = stage.clientHeight; S = sq[0].el.offsetWidth;
      const tr = hero.getBoundingClientRect(), sr = stage.getBoundingClientRect(), pad = 16;
      block = { l: tr.left - sr.left - pad, t: tr.top - sr.top - pad, r: tr.right - sr.left + pad, b: tr.bottom - sr.top + pad };
      const placed = [];
      sq.forEach(s => {
        let x, y, tries = 0;
        do {
          x = Math.random() * (W - S); y = Math.random() * (H - S); tries++;
        } while (tries < 300 && (hit(x, y, block) ||
                 placed.some(p => Math.abs(p.x - x) < S + 12 && Math.abs(p.y - y) < S + 12)));
        s.x = x; s.y = y; placed.push(s);
        const a = Math.random() * Math.PI * 2, v = 0.25 + Math.random() * 0.3;
        s.vx = Math.cos(a) * v; s.vy = Math.sin(a) * v;
        s.el.style.transform = `translate(${x}px, ${y}px)`;
      });
    }

    function tick() {
      sq.forEach(s => {
        if (s.hover) return;
        let nx = s.x + s.vx;
        if (nx < 0 || nx > W - S) { s.vx *= -1; nx = s.x + s.vx; }
        if (hit(nx, s.y, block)) { s.vx *= -1; nx = s.x; }
        let ny = s.y + s.vy;
        if (ny < 0 || ny > H - S) { s.vy *= -1; ny = s.y + s.vy; }
        if (hit(nx, ny, block)) { s.vy *= -1; ny = s.y; }
        s.x = nx; s.y = ny;
        s.el.style.transform = `translate(${nx}px, ${ny}px)`;
      });
      requestAnimationFrame(tick);
    }

    layout();
    if (!reduce) requestAnimationFrame(tick);
    let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 150); });
  </script>
  <script src="menu.js"></script>
</body>
</html>
