<!DOCTYPE html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'rodeo-white': '#ffffff',
                        'rodeo-grey': '#666666',
                        'rodeo-dark': '#222222',
                        'rodeo-chartreuse': '#DFFF00',

                    fontFamily: {

                        'typewriter': ['Courier New', 'Courier', 'monospace'],

    <style>
        :root {
            --orbit-radius: 260px;
        }

        body {
            background-color: #ffffff;
            color: #666666;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Dropdown Styles */
        .dropdown-content {
            display: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        .dropdown:hover .dropdown-content {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Orbit Layout Styles */
        .orbit-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            z-index: 10;
        }

        .orbit-item {
            position: absolute;
            width: 120px;
            height: 120px;
            margin-top: -60px; /* Half of height to center perfectly */
            margin-left: -60px; /* Half of width to center perfectly */
            border-radius: 50%;
            border: 4px solid transparent;
            transition: border-color 0.3s ease, transform 0.4s ease, box-shadow 0.3s ease;
            z-index: 20;
            background-color: #f5f5f5;
        }

        .orbit-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }

        .orbit-item:hover {
            border-color: #7fff00;
            box-shadow: 0 0 25px rgba(127, 255, 0, 0.4);
            z-index: 30;
            /* Subtly scale up on hover while maintaining orbit position */
            transform-origin: center center;
        }

        .orbit-item:hover img {
            filter: grayscale(0%);
        }

        /* Positioning the 8 images in a circle and counter-rotating them so they stay upright */
        .orbit-item:nth-child(1) { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg); }
        .orbit-item:nth-child(2) { transform: rotate(45deg) translateX(var(--orbit-radius)) rotate(-45deg); }
        .orbit-item:nth-child(3) { transform: rotate(90deg) translateX(var(--orbit-radius)) rotate(-90deg); }
        .orbit-item:nth-child(4) { transform: rotate(135deg) translateX(var(--orbit-radius)) rotate(-135deg); }
        .orbit-item:nth-child(5) { transform: rotate(180deg) translateX(var(--orbit-radius)) rotate(-180deg); }
        .orbit-item:nth-child(6) { transform: rotate(225deg) translateX(var(--orbit-radius)) rotate(-225deg); }
        .orbit-item:nth-child(7) { transform: rotate(270deg) translateX(var(--orbit-radius)) rotate(-270deg); }
        .orbit-item:nth-child(8) { transform: rotate(315deg) translateX(var(--orbit-radius)) rotate(-315deg); }

        /* Hover scaling fixes to append to existing transform */
        .orbit-item:nth-child(1):hover { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg) scale(1.1); }
        .orbit-item:nth-child(2):hover { transform: rotate(45deg) translateX(var(--orbit-radius)) rotate(-45deg) scale(1.1); }
        .orbit-item:nth-child(3):hover { transform: rotate(90deg) translateX(var(--orbit-radius)) rotate(-90deg) scale(1.1); }
        .orbit-item:nth-child(4):hover { transform: rotate(135deg) translateX(var(--orbit-radius)) rotate(-135deg) scale(1.1); }
        .orbit-item:nth-child(5):hover { transform: rotate(180deg) translateX(var(--orbit-radius)) rotate(-180deg) scale(1.1); }
        .orbit-item:nth-child(6):hover { transform: rotate(225deg) translateX(var(--orbit-radius)) rotate(-225deg) scale(1.1); }
        .orbit-item:nth-child(7):hover { transform: rotate(270deg) translateX(var(--orbit-radius)) rotate(-270deg) scale(1.1); }
        .orbit-item:nth-child(8):hover { transform: rotate(315deg) translateX(var(--orbit-radius)) rotate(-315deg) scale(1.1); }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            :root {
                --orbit-radius: 140px;
            }
            .orbit-item {
                width: 70px;
                height: 70px;
                margin-top: -35px;
                margin-left: -35px;
            }
        }
    </style>
</head>
