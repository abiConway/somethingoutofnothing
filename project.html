<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .ptitle { font-size: .85rem; font-weight: 400; margin: 0 0 2rem; }
    .wrap { position: relative; min-height: var(--mh, 0); }
    .blurb { margin: 0; overflow-wrap: anywhere; }
    .media .ph { position: absolute; width: var(--w, 16%); aspect-ratio: 1; left: var(--x); top: var(--y); }
    .ph.zoom { cursor: zoom-in; transition: scale .15s ease; }
    .ph.zoom:hover { scale: 1.05; }

    /* PDF windows */
    .docs { display: grid; gap: 3rem; margin-top: 3rem; }
    .doc { margin: 0; }
    .doc iframe { display: block; width: 100%; height: min(80vh, 56rem); min-height: 24rem; border: 1px solid var(--cream); background: #fff; }
    .doc figcaption { display: flex; justify-content: space-between; gap: 1rem; padding-top: .5rem; font-size: .8rem; }

    /* Lightbox */
    #lightbox { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; padding: 0; border: 0; color: var(--cream); background: rgba(4, 51, 255, .97); }
    #lightbox::backdrop { background: rgba(0, 0, 0, .6); }
    .lb { height: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .5rem; padding: 1rem; }
    #lbStage { display: flex; align-items: center; justify-content: center; min-width: 0; }
    #lbStage img, #lbStage video { max-width: 100%; max-height: 82vh; object-fit: contain; }
    .lb button { font: inherit; letter-spacing: inherit; color: var(--cream); background: none; border: 0; cursor: pointer; padding: .75rem; font-size: 1.4rem; }
    .lb button:hover { color: var(--chartreuse); }
    #lbClose { position: absolute; top: .5rem; right: .75rem; font-size: .85rem; }
    #lbCount { position: absolute; bottom: .75rem; left: 0; right: 0; text-align: center; }

    @media (max-width: 700px) {
      .wrap { min-height: 0; }
      .media { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem; }
      .media .ph { position: relative; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <a class="site-title" href="index.html">Welcome to the Rodeo</a>
    <div class="dropdown" id="menu">
      <button class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">Menu ▾</button>
      <ul class="dropdown-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="mailto:xaviervandemarkconway@gmail.com">Contact</a></li>
      </ul>
    </div>
  </header>

  <main class="page">
    <h1 class="ptitle" id="title"></h1>
    <div class="wrap">
      <p class="blurb" id="blurb"></p>
      <div class="media" id="media"></div>
    </div>
    <div class="docs" id="docs"></div>
  </main>

  <footer>
    <a href="https://instagram.com/xaviervandemarkconway">@xaviervandemarkconway</a>
    <a href="tel:+17194249460">(719) 424-9460</a>
    <a href="mailto:xaviervandemarkconway@gmail.com">xaviervandemarkconway@gmail.com</a>
  </footer>

  <dialog id="lightbox">
    <div class="lb">
      <button type="button" id="lbPrev" aria-label="Previous">←</button>
      <div id="lbStage"></div>
      <button type="button" id="lbNext" aria-label="Next">→</button>
      <button type="button" id="lbClose">Close ✕</button>
      <span id="lbCount"></span>
    </div>
  </dialog>

  <script src="projects.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('p');
    const p = projects[id] || projects[1];
    document.title = p.title;
    document.getElementById('title').textContent = `“${p.title}”`;
    document.getElementById('blurb').textContent = p.blurb;

    const isPdf = m => !!m && /\.pdf$/i.test(m);
    const isVideo = m => /\.(mp4|webm|mov)$/i.test(m);
    const items = p.media.filter(m => !isPdf(m));   // photos / videos / placeholders
    const docs = p.media.filter(isPdf);             // PDFs
    const gallery = items.filter(Boolean);          // what the lightbox flips through

    // ---- Overlay layout for photos ----
    const n = items.length;
    const cols = n <= 3 ? Math.max(n, 1) : (n === 4 ? 2 : 3);
    const rows = Math.ceil(n / cols);
    const xs = { 1: [32], 2: [33, 63], 3: [28, 56, 84] }[cols];
    const span = rows <= 2 ? 58 : 72;
    const ys = rows === 1 ? [38] : Array.from({ length: rows }, (_, r) => 6 + r * (span / (rows - 1)));
    const jit = [[0,0],[-1,3],[2,-2],[-2,2],[3,-3],[-3,1]];
    // more than 2 rows: extra height so the photos don't pile up
    if (rows > 2) document.querySelector('.wrap').style.setProperty('--mh', ((rows - 1) * 14 + 10) + 'rem');

    // ---- Lightbox ----
    const lb = document.getElementById('lightbox'), lbStage = document.getElementById('lbStage');
    let cur = 0;
    function showLb(i) {
      cur = (i + gallery.length) % gallery.length;
      const src = gallery[cur];
      const el = isVideo(src)
        ? Object.assign(document.createElement('video'), { src, controls: true, autoplay: true, loop: true, playsInline: true })
        : Object.assign(document.createElement('img'), { src, alt: `${p.title}, image ${cur + 1}` });
      lbStage.replaceChildren(el);
      document.getElementById('lbCount').textContent = `${cur + 1} / ${gallery.length}`;
    }
    function openLb(i) {
      showLb(i);
      const vis = gallery.length > 1 ? 'visible' : 'hidden';
      document.getElementById('lbPrev').style.visibility = vis;
      document.getElementById('lbNext').style.visibility = vis;
      lb.showModal();
    }
    document.getElementById('lbPrev').addEventListener('click', () => showLb(cur - 1));
    document.getElementById('lbNext').addEventListener('click', () => showLb(cur + 1));
    document.getElementById('lbClose').addEventListener('click', () => lb.close());
    lb.addEventListener('click', e => { if (!e.target.closest('img, video, button')) lb.close(); });
    lb.addEventListener('close', () => lbStage.replaceChildren());
    lb.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') showLb(cur + 1);
      if (e.key === 'ArrowLeft') showLb(cur - 1);
    });

    // ---- Photo / video tiles ----
    items.forEach((src, i) => {
      const box = document.createElement('div');
      box.className = 'ph';
      const [jx, jy] = jit[i % jit.length];
      box.style.setProperty('--x', (n === 1 ? 32 : xs[i % cols] + jx) + '%');
      box.style.setProperty('--y', (n === 1 ? 12 : ys[Math.floor(i / cols)] + jy) + '%');
      if (n === 1) box.style.setProperty('--w', '36%');
      if (src) {
        box.classList.add('has-media', 'zoom');
        box.tabIndex = 0;
        box.setAttribute('role', 'button');
        box.setAttribute('aria-label', 'View larger');
        const idx = gallery.indexOf(src);
        box.addEventListener('click', () => openLb(idx));
        box.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(idx); } });
        if (isVideo(src)) {
          box.append(Object.assign(document.createElement('video'), { src, autoplay: true, muted: true, loop: true, playsInline: true }));
        } else {
          box.append(Object.assign(document.createElement('img'), { src, alt: `${p.title}, image ${i + 1}` }));
        }
      } else {
        box.textContent = 'Photo';
      }
      document.getElementById('media').append(box);
    });

    // ---- PDF windows (shown right on the page) ----
    docs.forEach(src => {
      const label = decodeURIComponent(src.split('/').pop().replace(/\.pdf$/i, ''));
      const fig = document.createElement('figure');
      fig.className = 'doc';
      const frame = Object.assign(document.createElement('iframe'), { src: src + '#view=FitH', title: label });
      const cap = document.createElement('figcaption');
      const name = Object.assign(document.createElement('span'), { textContent: label });
      const dl = Object.assign(document.createElement('a'), { href: src, textContent: 'Download PDF' });
      dl.setAttribute('download', '');
      cap.append(name, dl);
      fig.append(frame, cap);
      document.getElementById('docs').append(fig);
    });
  </script>
  <script src="menu.js"></script>
</body>
</html>
